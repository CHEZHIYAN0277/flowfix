[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fulfillflow-recovery-fixture"
version = "0.1.0"
description = "Controlled multi-module repair fixture for ProoFix demos"
requires-python = ">=3.11"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["fulfillflow*"]
